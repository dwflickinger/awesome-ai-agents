name: Insert AgentClear Entry
on:
  push:
    branches:
      - add-agentclear-v5
jobs:
  edit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run edit script
        run: python edit_script.py
      - name: Commit and push changes
        run: |
          git config user.name "dwflickinger"
          git config user.email "133731428+dwflickinger@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Add AgentClear to open source projects list"
          git push
